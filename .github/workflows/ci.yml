name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore EasyPDF.slnx --locked-mode

      - name: Verify formatting
        run: dotnet format EasyPDF.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build EasyPDF.slnx -c Release --no-restore

      - name: Test
        run: dotnet test EasyPDF.slnx -c Release --no-build --collect:"XPlat Code Coverage"

      - name: Audit dependencies
        shell: pwsh
        run: |
          $report = dotnet list EasyPDF.slnx package --vulnerable --include-transitive
          $report | Write-Output
          if ($report -match 'has the following vulnerable packages') { throw 'Vulnerable packages detected.' }

      - name: Publish and build MSI
        shell: pwsh
        run: ./installer/build.ps1 -Configuration Release

      - name: Upload installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: EasyPDF-windows-x64
          path: |
            installer/bin/Release/*.msi
            THIRD-PARTY-NOTICES.md
          if-no-files-found: error
