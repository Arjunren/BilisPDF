name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore EasyPDF.slnx --locked-mode

      - name: Verify formatting
        run: dotnet format EasyPDF.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build EasyPDF.slnx -c Release --no-restore

      - name: Test
        run: dotnet test EasyPDF.slnx -c Release --no-build --collect:"XPlat Code Coverage"

      - name: Audit dependencies
        shell: pwsh
        run: |
          $report = dotnet list EasyPDF.slnx package --vulnerable --include-transitive
          $report | Write-Output
          if ($report -match 'has the following vulnerable packages') { throw 'Vulnerable packages detected.' }

      - name: Publish and build MSI
        shell: pwsh
        run: ./installer/build.ps1 -Configuration Release

      - name: Test native Explorer commands
        shell: pwsh
        run: |
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
          if (-not $msbuild) { throw 'C++ MSBuild was not found.' }
          & $msbuild tests/native/ShellExtensionTests.vcxproj /p:Configuration=Release /p:Platform=x64 /m
          if ($LASTEXITCODE -ne 0) { throw 'Native test build failed.' }
          & ./artifacts/native-tests/ShellExtensionTests.exe
          if ($LASTEXITCODE -ne 0) { throw 'Native Explorer checks failed.' }

      - name: Upload installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: EasyPDF-windows-x64
          path: |
            installer/bin/x64/Release/*.msi
            THIRD-PARTY-NOTICES.md
          if-no-files-found: error
