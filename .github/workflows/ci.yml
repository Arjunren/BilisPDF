name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore BilisPDF.slnx --locked-mode

      - name: Verify formatting
        run: dotnet format BilisPDF.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build BilisPDF.slnx -c Release --no-restore

      - name: Test
        run: dotnet test BilisPDF.slnx -c Release --no-build --collect:"XPlat Code Coverage"

      - name: Audit dependencies
        shell: pwsh
        run: |
          $report = dotnet list BilisPDF.slnx package --vulnerable --include-transitive
          $report | Write-Output
          if ($report -match 'has the following vulnerable packages') { throw 'Vulnerable packages detected.' }

      - name: Publish and build MSI
        shell: pwsh
        run: ./installer/build.ps1 -Configuration Release

      - name: Test native Explorer commands
        shell: pwsh
        run: |
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
          if (-not $msbuild) { throw 'C++ MSBuild was not found.' }
          & $msbuild tests/native/ShellExtensionTests.vcxproj /p:Configuration=Release /p:Platform=x64 /m
          if ($LASTEXITCODE -ne 0) { throw 'Native test build failed.' }
          & ./artifacts/native-tests/ShellExtensionTests.exe
          if ($LASTEXITCODE -ne 0) { throw 'Native Explorer checks failed.' }

      - name: Verify release signing guards
        shell: pwsh
        run: ./tests/Test-ReleaseSigning.ps1 -UnsignedBinary ./installer/payload/BilisPDF.Desktop.exe

      - name: Upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: BilisPDF-windows-x64
          path: |
            installer/bin/x64/Release/*.msi
            installer/bin/x64/Release/*.msix
            installer/bin/x64/Release/SHA256SUMS.txt
            THIRD-PARTY-NOTICES.md
          if-no-files-found: error
